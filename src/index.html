<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f4f5" />
    <title>计算器</title>
    <script>
      (() => {
        let preference = null;
        try {
          preference = localStorage.getItem('calculator-theme');
        } catch {
          // Browser storage can be unavailable in a private session.
        }
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = preference === 'dark' || (preference !== 'light' && systemDark)
          ? 'dark'
          : 'light';
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./config.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <h1>计算器</h1>
        <div class="header-actions">
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到深色模式">
            <span class="theme-icon" id="theme-icon" aria-hidden="true">☾</span>
            <span id="theme-label">深色模式</span>
          </button>
          <details class="settings" id="settings">
            <summary aria-label="打开接口设置">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 2h2.8l.5 2.3c.5.2 1 .4 1.4.8l2.1-1.1 2 2-1.1 2.1c.3.4.6.9.8 1.4l2.3.5v2.8l-2.3.5c-.2.5-.5 1-.8 1.4l1.1 2.1-2 2-2.1-1.1c-.4.3-.9.6-1.4.8l-.5 2.3h-2.8l-.5-2.3c-.5-.2-1-.5-1.4-.8l-2.1 1.1-2-2 1.1-2.1c-.3-.4-.6-.9-.8-1.4L2 13.4v-2.8l2.3-.5c.2-.5.5-1 .8-1.4L4 6.6l2-2 2.1 1.1c.4-.3.9-.6 1.4-.8L10.6 2Z"/><circle cx="12" cy="12" r="3"/></svg>
              <span>接口设置</span>
            </summary>
            <form id="settings-form" class="settings-panel">
              <label for="api-url">后端 API 地址</label>
              <input id="api-url" name="api-url" type="url" inputmode="url" autocomplete="url" spellcheck="false" aria-label="后端 API 地址" required />
              <button type="submit" aria-label="保存后端地址并重新连接">保存并重新连接</button>
              <span class="settings-error" id="settings-error" role="alert"></span>
            </form>
          </details>
        </div>
      </header>

      <main>
        <div class="intro">
          <div class="connection-status" id="connection-status" data-state="connecting" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="connection-label">正在连接后端</span>
          </div>
        </div>

        <div class="workspace">
          <section class="calculator-card" aria-labelledby="calculator-heading">
            <div class="card-heading">
              <h2 id="calculator-heading">计算</h2>
            </div>

            <form id="calculator-form" novalidate>
              <div class="display">
                <div class="display-topline">
                  <label for="expression">表达式</label>
                  <button class="backspace-button" id="backspace-button" type="button" aria-label="删除光标前的字符" title="退格">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H20a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H9a2 2 0 0 1-1.5-.7L2 12l5.5-7.3A2 2 0 0 1 9 4Z"/><path d="m12 9 6 6m0-6-6 6"/></svg>
                  </button>
                </div>
                <input id="expression" name="expression" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
                <div class="result-area">
                  <span id="result-expression"></span>
                  <output id="result" for="expression" aria-live="polite" aria-atomic="true">—</output>
                </div>
              </div>

              <p id="calculator-error" class="calculator-error" role="alert" aria-live="assertive" hidden></p>

              <details class="scientific-tools" id="scientific-tools">
                <summary>
                  <span>科学计算</span>
                  <span class="scientific-mode">三角函数：RAD 弧度</span>
                </summary>
                <div class="scientific-keypad" id="scientific-keypad" aria-label="科学计算按键">
                  <button type="button" class="scientific-key" data-function="sin" aria-label="正弦 sin，弧度">sin</button>
                  <button type="button" class="scientific-key" data-function="cos" aria-label="余弦 cos，弧度">cos</button>
                  <button type="button" class="scientific-key" data-function="tan" aria-label="正切 tan，弧度">tan</button>
                  <button type="button" class="scientific-key" data-insert="^" aria-label="幂运算">xʸ</button>

                  <button type="button" class="scientific-key" data-function="sqrt" aria-label="平方根 sqrt">√x</button>
                  <button type="button" class="scientific-key" data-function="ln" aria-label="自然对数 ln">ln</button>
                  <button type="button" class="scientific-key" data-function="log" aria-label="常用对数 log，以 10 为底">log₁₀</button>
                  <button type="button" class="scientific-key" data-function="abs" aria-label="绝对值 abs">|x|</button>

                  <button type="button" class="scientific-key" data-insert="pi" aria-label="圆周率 pi">π</button>
                  <button type="button" class="scientific-key" data-insert="e" aria-label="自然常数 e">e</button>
                  <button type="button" class="scientific-key" data-action="square" aria-label="平方">x²</button>
                  <button type="button" class="scientific-key" data-action="group" aria-label="插入一对括号">( )</button>
                </div>
              </details>

              <div class="keypad" id="keypad" aria-label="计算器按键">
                <button type="button" class="key key-utility" data-action="clear" aria-label="清空表达式">AC</button>
                <button type="button" class="key key-utility" data-insert="(" aria-label="左括号">(</button>
                <button type="button" class="key key-utility" data-insert=")" aria-label="右括号">)</button>
                <button type="button" class="key key-operator" data-insert="÷" aria-label="除号">÷</button>

                <button type="button" class="key" data-insert="7">7</button>
                <button type="button" class="key" data-insert="8">8</button>
                <button type="button" class="key" data-insert="9">9</button>
                <button type="button" class="key key-operator" data-insert="×" aria-label="乘号">×</button>

                <button type="button" class="key" data-insert="4">4</button>
                <button type="button" class="key" data-insert="5">5</button>
                <button type="button" class="key" data-insert="6">6</button>
                <button type="button" class="key key-operator" data-insert="−" aria-label="减号">−</button>

                <button type="button" class="key" data-insert="1">1</button>
                <button type="button" class="key" data-insert="2">2</button>
                <button type="button" class="key" data-insert="3">3</button>
                <button type="button" class="key key-operator" data-insert="+" aria-label="加号">+</button>

                <button type="button" class="key key-utility" data-action="sign" aria-label="切换末尾数字正负号">±</button>
                <button type="button" class="key" data-insert="0">0</button>
                <button type="button" class="key" data-insert=".">.</button>
                <button type="submit" class="key key-equals" id="calculate-button" aria-label="计算结果">=</button>
              </div>
            </form>
          </section>

          <section class="history-card" aria-labelledby="history-heading">
            <div class="card-heading history-heading">
              <h2 id="history-heading">历史记录</h2>
              <button class="refresh-button" id="refresh-history" type="button" aria-label="刷新计算历史" title="刷新历史">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 12-2L20 12M4 12l2.5 5a7 7 0 0 0 12-2"/></svg>
              </button>
            </div>
            <div class="history-state" id="history-state" role="status" aria-live="polite">正在加载历史记录…</div>
            <ol class="history-list" id="history-list" aria-label="计算历史列表"></ol>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
